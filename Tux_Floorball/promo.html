<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tux Floorball — 2D Dance Clip</title><style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:'Courier New',monospace}
body{background:#090c10;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;width:100vw;max-width:430px;height:100vh;max-height:820px;background:#0f141d;border:2px solid #2ed573;border-radius:16px;overflow:hidden;box-shadow:0 0 40px rgba(46,213,115,.25)}
canvas{width:100%;height:100%;display:block}
#tap{position:absolute;inset:0;background:rgba(9,12,16,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;text-align:center;padding:20px;cursor:pointer}
#tap button{background:#ffd000;color:#111;border:0;padding:14px 28px;border-radius:24px;font-size:16px;font-weight:900;box-shadow:0 0 20px rgba(255,208,0,.4)}
</style></head><body>
<div id="wrap">
  <div id="tap"><div style="font-size:44px">🐧🏒🔥</div><div style="font-size:18px;font-weight:900;color:#fff">TUX FLOORBALL 2D CLIP</div><div style="font-size:12px;color:#8b949e">Включи запись экрана на телефоне и жми старт</div><button>▶ PLAY + BEAT</button></div>
  <canvas id="c" width="450" height="800"></canvas>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let ac=null,started=0,t0=0,beatIdx=0,pulse=0;
const codeBg=[
  "const game = new TuxFloorball();",
  "if (ball.inGoal) celebrate('TUX');",
  "penguin.trick('SNAIL_360');",
  "ai.setTactics('SMART_PASS_IQ80');",
  "shootout.mode = 'ENDLESS_IFF';",
  "git push origin master // StormKot"
];
const titles=[
  ["TUX FLOORBALL","СДЕЛАНО НА PYTHON & JS"],
  ["2D ПИНГВИНЫ","С КЛЮШКАМИ И УЛИТКОЙ"],
  ["БУЛЛИТЫ IFF","ЗОЛОТОЙ ГОЛ И УМНЫЙ ИИ"],
  ["STORMKOT","://github.com"]
];
const melody=[261.6,311.1,392.0,523.3,466.2,392.0,311.1,392.0,261.6,311.1,392.0,587.3,523.3,466.2,392.0,311.1];
function playTick(){
  if(!ac)return;
  const now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),k=ac.createOscillator(),kg=ac.createGain();
  o.type='square';o.frequency.setValueAtTime(melody[beatIdx%melody.length],now);
  g.gain.setValueAtTime(0.07,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);
  o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+0.16);
  if(beatIdx%2===0){
    k.type='triangle';k.frequency.setValueAtTime(beatIdx%4===0?135:75,now);
    k.frequency.exponentialRampToValueAtTime(32,now+0.12);
    kg.gain.setValueAtTime(0.24,now);kg.gain.exponentialRampToValueAtTime(0.001,now+0.13);
    k.connect(kg);kg.connect(ac.destination);k.start(now);k.stop(now+0.14);
  }
  pulse=1;beatIdx++;
}
function drawPenguin(px,py,sc,col,phase,isCenter){
  x.save();
  const bounce=Math.abs(Math.sin(phase))*18*(isCenter?1.3:0.9);
  const tilt=Math.sin(phase*0.5)*(isCenter?0.22:0.14);
  const headSpin=(isCenter&&(beatIdx%16>=12))?(phase*2.5):0;
  x.translate(px,py-bounce);
  x.fillStyle='rgba(0,0,0,0.35)';x.beginPath();x.ellipse(0,58*sc+bounce,36*sc,9*sc,0,0,7);x.fill();
  x.rotate(tilt+headSpin);x.scale(sc,sc);
  const stepL=Math.sin(phase)*8,stepR=-Math.sin(phase)*8;
  x.fillStyle='#ff9f1a';
  x.beginPath();x.ellipse(-16,50+stepL,13,7,-0.2,0,7);x.fill();
  x.beginPath();x.ellipse(16,50+stepR,13,7,0.2,0,7);x.fill();
  x.fillStyle='#161b24';x.beginPath();x.ellipse(0,8,34,44,0,0,7);x.fill();
  x.fillStyle='#ffffff';x.beginPath();x.ellipse(0,14,22,31,0,0,7);x.fill();
  x.fillStyle=col;x.beginPath();x.roundRect(-28,-4,56,24,8);x.fill();
  x.fillStyle='#111';x.font='900 13px sans-serif';x.textAlign='center';x.fillText(isCenter?'10':'7',0,12);
  const armL=Math.sin(phase)*0.6-0.5,armR=-Math.sin(phase)*0.6+0.5;
  x.save();x.translate(-32,-2);x.rotate(armL);x.fillStyle='#161b24';x.beginPath();x.ellipse(-10,12,8,20,0.2,0,7);x.fill();x.restore();
  x.save();x.translate(32,-2);x.rotate(armR);x.fillStyle='#161b24';x.beginPath();x.ellipse(10,12,8,20,-0.2,0,7);x.fill();
  x.strokeStyle='#e6edf3';x.lineWidth=4;x.beginPath();x.moveTo(10,22);x.lineTo(36,-18);x.stroke();
  x.fillStyle='#00e5ff';x.beginPath();x.roundRect(30,-28,16,8,3);x.fill();
  x.restore();
  x.fillStyle='#161b24';x.beginPath();x.arc(0,-34,24,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(-8,-37,4.5,0,7);x.arc(8,-37,4.5,0,7);x.fill();
  x.fillStyle='#111';x.beginPath();x.arc(-7,-37,2.2,0,7);x.arc(9,-37,2.2,0,7);x.fill();
  x.fillStyle='#ff9f1a';x.beginPath();x.moveTo(-7,-30);x.lineTo(7,-30);x.lineTo(0,-21);x.closePath();x.fill();
  x.restore();
}
function loop(now){
  requestAnimationFrame(loop);
  if(!started)return;
  const t=(now-t0)/1000,phase=t*7.2;
  pulse*=0.88;
  x.fillStyle='#0d121a';x.fillRect(0,0,450,800);
  const grd=x.createRadialGradient(225,440,20,225,440,210+pulse*35);
  grd.addColorStop(0,'rgba(46,213,115,0.28)');grd.addColorStop(1,'rgba(13,18,26,0)');
  x.fillStyle=grd;x.fillRect(0,180,450,500);
  x.fillStyle='#161e29';x.fillRect(0,0,450,42);
  ['#ff5f56','#ffbd2e','#27c93f'].forEach((cl,i)=>{x.fillStyle=cl;x.beginPath();x.arc(22+i*18,21,5.5,0,7);x.fill();});
  x.fillStyle='#8b949e';x.font='bold 12px monospace';x.textAlign='right';x.fillText('claude-code // Tux_Floorball',432,25);
  x.textAlign='left';x.font='12px monospace';
  codeBg.forEach((ln,i)=>{
    const yPos=72+i*22;
    x.fillStyle=i===(beatIdx%codeBg.length)?'#2ed573':'rgba(139,148,158,0.45)';
    x.fillText((i===(beatIdx%codeBg.length)?'❯ ':'  ')+ln,18,yPos);
  });
  x.fillStyle='#1b6cb3';x.beginPath();x.roundRect(24,520,402,110,24);x.fill();
  x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
  x.beginPath();x.arc(225,575,32,0,7);x.stroke();
  drawPenguin(105,495,0.92,'#ff5252',phase+1.2,0);
  drawPenguin(345,495,0.92,'#00d2d3',phase+2.4,0);
  drawPenguin(225,515,1.22,'#ffd000',phase,1);
  const bx=225+Math.sin(phase*0.5)*130,by=585-Math.abs(Math.cos(phase))*28;
  x.fillStyle='#fff';x.beginPath();x.arc(bx,by,8,0,7);x.fill();
  const sl=titles[(beatIdx/8|0)%titles.length];
  x.save();x.translate(225,255);x.scale(1+pulse*0.09,1+pulse*0.09);
  x.fillStyle='#fff';x.font='900 30px sans-serif';x.textAlign='center';x.fillText(sl[0],0,0);
  x.fillStyle='#ffd000';x.font='800 14px monospace';x.fillText(sl[1],0,26);
  x.restore();
  for(let i=0;i<22;i++){
    const bh=10+Math.abs(Math.sin(phase+i*0.6))*48*(0.5+pulse*0.6);
    x.fillStyle=i%2?'#2ed573':'#ffd000';
    x.fillRect(28+i*18,755-bh,11,bh);
  }
}
document.getElementById('tap').onclick=()=>{
  document.getElementById('tap').style.display='none';
  ac=new(window.AudioContext||window.webkitAudioContext)();
  started=1;t0=performance.now();playTick();setInterval(playTick,185);
};
requestAnimationFrame(loop);
</script></body></html>
