function sfx(f,d,tp='sine',v=.12){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=tp;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*.4,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}

function togglePullGk(){if(soMode||over)return;pullMyGk=pullMyGk?0:1;const btn=document.getElementById('pullBtn');btn.textContent=pullMyGk?_tr('ret'):_tr('pull');btn.style.background=pullMyGk?'#ffd000':'#2f3542';btn.style.color=pullMyGk?'#111':'#ffd000';const ros=teamRoster(myTeam);if(actIdx>=ros.length)actIdx=0;if(pullMyGk){const ex=(myTeam?tB:tP)[baseCnt()];if(ex){ex.x=myTeam?585:185;ex.y=9;}}sfx(pullMyGk?620:420,.1);}

  gameMode=document.getElementById('md').value;myRole=document.getElementById('role').value;myTeam=+document.getElementById('tmSel').value;botMult=+document.getElementById('diff').value;chaosOn=document.getElementById('chaosCb').checked?1:0;myNum=Math.max(1,Math.min(99,+document.getElementById('pNum').value||10));

const canSwitch=()=>!soMode&&teamRoster(myTeam).length>1;
function mode(st){const swOk=canSwitch(),zLock=(zorroCd>0||zorroT>0?1:0),key=st+'_'+(swOk?1:0)+'_'+curLang+'_'+zLock;if(atkUI===key)return;atkUI=key;const p=myP();if(p.gk){mB.textContent=own===p?_tr('thr'):_tr('def');mB.style.background=own===p?'#2ed573':'#ffa502';s1.textContent=swOk?_tr('sw'):_tr('busy');s1.style.background=swOk?'#1e90ff':'#57606f';return;}mB.textContent=st==='atk'?_tr('atk'):_tr('def');mB.style.background=st==='atk'?'#ff4757':'#ffa502';s1.textContent=st==='atk'?_tr('snail'):(swOk?_tr('sw'):_tr('nosw'));s1.style.background=st==='atk'?(zLock?'#57606f':'#a55eea'):(swOk?'#1e90ff':'#57606f');}
