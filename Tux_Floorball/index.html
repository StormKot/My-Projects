<script>
const c=document.getElementById('c'),x=c.getContext('2d'),GL=115,GR=785,COLS=['#00ff88','#ff007f','#00e5ff','#ff9f1a','#c56cf0'],rc=()=>COLS.at(Math.random()*5|0);
let sP=0,sB=0,tLeft=60,perCur=1,perMax=3,perDur=60,otMode=0,over=1,goalT=0,gTxt='',k={},joy={x:0,y:0},jid=null,chg=0,isC=0,own=null,cd=0,actIdx=0,col1='#ffd000',col2='#ff5252',lastTouch=null,repBuf=[],repIdx=0,soLog=[],soMode=0,soTurn=0,soTimer=0,soShot=0,soBestX=450,shotsP=0,shotsB=0,savesP=0,savesB=0,possP=0,possB=0,pullMyGk=0,penPlayer=null,penT=0,zorroT=0,evName='',evT=0,evCd=16,chaosOn=1,shake=0,dt=0,last=0,btT=0,dT=0,pkT=0,askT=0,atkUI='',ac=null,pts=[],myTeam=0,myNum=10,myRole='field',botMult=1,gameMode='5v5';
const mkTeam=(tm,col)=>Array.from({length:6},(_,i)=>({x:0,y:0,bx:0,by:0,r:14,a:tm?3.14:0,s:250,c:col,h:rc(),t:tm,num:7+i*4,st:1,pts:0}));

const mB=document.getElementById('mB'),s1=document.getElementById('s1'),s2=document.getElementById('s2'),askBtn=document.getElementById('askBtn'),admBtn=document.getElementById('admBtn'),admBox=document.getElementById('admBox');
admBtn.onclick=()=>admBox.style.display=admBox.style.display==='flex'?'none':'flex';
function admShootout(){admBox.style.display='none';sP=sB;document.getElementById('sp').textContent=sP;document.getElementById('sb').textContent=sB;soMode=1;soTurn=0;soLog=[];goalT=1.2;gTxt='🔥 БУЛЛИТЫ IFF!';startPenalty();}

function sfx(f,d,tp='sine',v=.12){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=tp;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*.4,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function boom(gx,col){for(let i=0;i<24;i++){const a=Math.random()*6.28,sp=80+Math.random()*220;pts.push({x:gx,y:225,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:i%2?col:'#fff'});}}
const baseCnt=()=>gameMode==='5v5'?5:(gameMode==='3v3'?3:1);
const teamRoster=tm=>{const cnt=baseCnt();if(pullMyGk&&tm===myTeam)return(tm?tB:tP).slice(0,cnt+1);return[...(tm?tB:tP).slice(0,cnt),tm?gR:gL];};
const myP=()=>teamRoster(myTeam).at(actIdx)||teamRoster(myTeam).at(0);
document.getElementById('tmSel').onchange=e=>{const tm=+e.target.value,inp=document.getElementById('tName'),cs=document.getElementById('tCol');if(tm===1&&inp.value==='OMSK TIGERS'){inp.value='RED BEARS';cs.value='#ff5252';}if(tm===0&&inp.value==='RED BEARS'){inp.value='OMSK TIGERS';cs.value='#ffd000';}};
function togglePullGk(){if(soMode||over)return;pullMyGk=pullMyGk?0:1;const btn=document.getElementById('pullBtn');btn.textContent=pullMyGk?'🥅 ВЕРНУТЬ ВРТ':'🥅 СНЯТЬ ВРТ';btn.style.background=pullMyGk?'#ffd000':'#2f3542';btn.style.color=pullMyGk?'#111':'#ffd000';const ros=teamRoster(myTeam);if(actIdx>=ros.length)actIdx=0;sfx(pullMyGk?620:420,.1);}

document.getElementById('go').onclick=async()=>{
  gameMode=document.getElementById('md').value;myRole=document.getElementById('role').value;myTeam=+document.getElementById('tmSel').value;botMult=+document.getElementById('diff').value;chaosOn=document.getElementById('chaosCb').checked?1:0;myNum=Math.max(1,Math.min(99,+document.getElementById('pNum').value||10));
  perMax=+document.getElementById('pers').value;perDur=+document.getElementById('dur').value;perCur=1;otMode=0;
  const myCol=document.getElementById('tCol').value,nm=document.getElementById('tName').value.trim()||'CLUB';
  if(myTeam===0){col1=myCol;col2='#ff5252';document.getElementById('n1').textContent=nm;document.getElementById('n2').textContent='RED BEARS';}else{col1='#ffd000';col2=myCol;document.getElementById('n1').textContent='OMSK TIGERS';document.getElementById('n2').textContent=nm;}
  tP.forEach(e=>{e.c=col1;e.pts=0;e.st=1;});tB.forEach(e=>{e.c=col2;e.pts=0;e.st=1;});document.getElementById('n1').style.color=col1;document.getElementById('n2').style.color=col2;
  document.getElementById('menu').style.display='none';sP=sB=shotsP=shotsB=savesP=savesB=possP=possB=soMode=0;soLog=[];evName='';evT=0;evCd=12;tLeft=perDur;document.getElementById('sp').textContent=0;document.getElementById('sb').textContent=0;over=0;rst();sfx(440,.1);
  try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape');}catch(e){}
};
document.getElementById('re').onclick=()=>{over=1;soMode=0;otMode=0;document.getElementById('end').style.display='none';document.getElementById('menu').style.display='flex';};
function startPenalty(){
  const shootTm=soTurn%2;tP.forEach((e,i)=>{e.x=175+i*35;e.y=9;});tB.forEach((e,i)=>{e.x=565+i*35;e.y=9;});
  gL.x=shootTm===1?GL+16:155;gL.y=shootTm===1?225:9;gR.x=shootTm===0?GR-16:745;gR.y=shootTm===0?225:9;
  const shooter=(shootTm===0?tP.at(0):tB.at(0));shooter.x=450;shooter.y=225;shooter.a=shootTm?3.14:0;b.x=450+(shootTm?-20:20);b.y=225;b.vx=b.vy=b.sp=b.pwr=0;own=shooter;lastTouch=shooter;soShot=0;soTimer=14;soBestX=450;isC=chg=cd=pkT=0;k.Space=0;
  if(myTeam===shootTm){actIdx=0;shooter.s=265;}else{btT=3.2;actIdx=teamRoster(myTeam).length-1;}
}
function rst(){
  tP.forEach((e,i)=>{e.bx=280;e.x=gameMode==='1v1'?415:340-(i%2)*85;e.y=e.by=gameMode==='1v1'?225:100+i*50;e.a=0;e.h=rc();e.num=7+i*4;e.s=250*botMult;e.st=Math.min(1,e.st+.35);});
  tB.forEach((e,i)=>{e.bx=620;e.x=gameMode==='1v1'?485:560+(i%2)*85;e.y=e.by=gameMode==='1v1'?225:100+i*50;e.a=3.14;e.h=rc();e.num=7+i*4;e.s=230*botMult;e.st=Math.min(1,e.st+.35);});
  gL.x=gL.bx=GL+16;gL.y=gL.by=225;gL.num=1;gL.s=170*botMult;gR.x=gR.bx=GR-16;gR.y=gR.by=225;gR.num=30;gR.s=170*botMult;
  pullMyGk=0;const pb=document.getElementById('pullBtn');pb.textContent='🥅 СНЯТЬ ВРТ';pb.style.background='#2f3542';pb.style.color='#ffd000';
  const ros=teamRoster(myTeam);actIdx=myRole==='gk'?ros.length-1:0;const me=myP();me.num=myNum;me.s=me.gk?195:265;
  own=null;lastTouch=null;penPlayer=null;penT=0;zorroT=0;chg=isC=cd=dT=pkT=askT=shake=0;b.x=450;b.y=225;b.vx=b.vy=b.sp=b.pwr=0;
}
const canSwitch=()=>!soMode&&teamRoster(myTeam).length>1;
function mode(st){const swOk=canSwitch(),key=st+'_'+(swOk?1:0);if(atkUI===key)return;atkUI=key;const p=myP();askBtn.style.display=(own===p||soMode?'none':'block');if(p.gk){mB.textContent=own===p?'БРОСОК':'ОТБОР';mB.style.background=own===p?'#2ed573':'#ffa502';s1.textContent=swOk?'СМЕНА':'ЗАНЯТО';s1.style.background=swOk?'#1e90ff':'#57606f';return;}mB.textContent=st==='atk'?'ПАС/УДАР':'ОТБОР';mB.style.background=st==='atk'?'#ff4757':'#ffa502';s1.textContent=st==='atk'?'ЗОРРО':(swOk?'СМЕНА':'НЕТ СМЕНЫ');s1.style.background=st==='atk'?'#a55eea':(swOk?'#1e90ff':'#57606f');}
function askPass(){askT=1.3;sfx(780,.07);const p=myP();if(own&&own!==p&&own.t===myTeam){const leadX=p.x+Math.cos(p.a)*45,leadY=p.y+Math.sin(p.a)*45,a=Math.atan2(leadY-own.y,leadX-own.x);b.vx=Math.cos(a)*560;b.vy=Math.sin(a)*560;own=null;cd=.2;}}
function mDown(){
  const p=myP();if(p===penPlayer)return;
  if(own===p){isC=1;chg=.01;}else{
    pkT=.22;dT=.15;sfx(260,.08,'triangle',.08);
    if(!p.gk&&!soMode){
      if(gameMode!=='1v1'&&own&&own.t!==myTeam&&Math.hypot(p.x-own.x,p.y-own.y)<32&&Math.abs(Math.sin(p.a-own.a))<.5&&Math.cos(p.a-own.a)>.55&&!penPlayer){
        const victim=own;sfx(2800,.18,'sine',.2);

        return;
      }
      const t=tip(p,p.a);if(Math.hypot(b.x-t.x,b.y-t.y)<36){own=p;lastTouch=p;p.pts+=.5;cd=.18;sfx(520,.06);}
    }
  }

function mUp(){if(!isC)return;const p=myP();if(own===p){const isP=!soMode&&!p.gk&&chg<.24,a=p.a,pw=p.gk?500+Math.min(1,chg)*300:(isP?530:440+Math.min(1,chg)*560),sp=p.gk||isP?0:(joy.y||0)*2.2,pwr=!p.gk&&!isP&&chg>=.88?1:0;b.vx=Math.cos(a)*pw;b.vy=Math.sin(a)*pw;b.sp=sp;b.pwr=pwr;if(!isP){if(p.t===0)shotsP++;else shotsB++;}b.x+=Math.cos(a)*15;b.y+=Math.sin(a)*15;own=null;cd=.22;sfx(pwr?120:(isP?420:190),pwr?.24:(isP?.08:.16),'triangle',.18);if(isP&&canSwitch())doSwitch();}isC=chg=0;}
function doSwitch(){if(!canSwitch())return;const ros=teamRoster(myTeam);for(let s=1;s<=ros.length;s++){const nxt=(actIdx+s)%ros.length;if(ros.at(nxt)!==penPlayer){actIdx=nxt;break;}}const np=myP();np.s=np.gk?195:265;isC=chg=0;sfx(560,.06);}
function s1Act(){const p=myP();if(!p.gk&&own===p){if(isC)isC=chg=0;zorroT=.35;b.sp=4.2;dT=.18;sfx(660,.12,'sine',.12);}else doSwitch();}
const dash=()=>{const p=myP();if(p.st>=.32&&dT<=0){dT=.22;p.st-=.32;sfx(300,.1,'sawtooth',.06);}};
addEventListener('keydown',e=>{k[e.code]=1;if(e.code==='Space'&&!isC)mDown();if(e.code==='KeyC')askPass();if(e.code==='KeyQ'||e.code==='Tab'){e.preventDefault();s1Act();}if(e.code==='ShiftLeft')dash();});

const jz=document.getElementById('joy'),kn=document.getElementById('kn');
function uJ(cx,cy){const r=jz.getBoundingClientRect();let dx=cx-(r.left+52),dy=cy-(r.top+52),d=Math.hypot(dx,dy);if(d>34){dx=dx/d*34;dy=dy/d*34;}kn.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/34;joy.y=dy/34;}
jz.onpointerdown=e=>{jid=e.pointerId;jz.setPointerCapture(jid);uJ(e.clientX,e.clientY);};jz.onpointermove=e=>{if(e.pointerId===jid)uJ(e.clientX,e.clientY);};jz.onpointerup=jz.onpointercancel=e=>{if(e.pointerId===jid){jid=null;joy={x:0,y:0};kn.style.transform='translate(0,0)';}};
mB.onpointerdown=e=>{e.preventDefault();mDown();};mB.onpointerup=mB.onpointercancel=e=>{e.preventDefault();mUp();};s1.onpointerdown=e=>{e.preventDefault();s1Act();};s2.onpointerdown=e=>{e.preventDefault();dash();};askBtn.onpointerdown=e=>{e.preventDefault();askPass();};
function pushBox(e,x1,y1,x2,y2){const cx=Math.max(x1,Math.min(x2,e.x)),cy=Math.max(y1,Math.min(y2,e.y)),dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);if(d<e.r){if(d>0){e.x=cx+dx/d*e.r;e.y=cy+dy/d*e.r;}else e.x=x1-e.r;}}
