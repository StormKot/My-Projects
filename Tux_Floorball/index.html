<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tux Floorball Online</title>
<style>
*{box-sizing:border-box;user-select:none;font-family:sans-serif}
body{margin:0;background:#0e1218;color:#fff;width:100vw;height:100vh;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
#menu,#end{position:fixed;inset:0;background:radial-gradient(circle,#192231,#0b0e14);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:5px;padding:6px}
#end{display:none}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:5px;width:95%;max-width:480px}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:12px}
input,select{background:#111620;color:#fff;border:1px solid #3a465c;border-radius:7px;padding:4px 7px;font-size:12px;font-weight:700}
input[type=number]{width:54px;text-align:center}
#lobby{background:rgba(0,0,0,.35);border-radius:8px;padding:5px 8px;font-size:11px;min-height:28px;color:#a4b0be;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{background:#2f3542;padding:2px 6px;border-radius:6px;color:#fff;font-weight:700}
button.big{padding:10px 20px;border-radius:20px;background:#2ed573;color:#111;border:0;font-size:14px;font-weight:900;width:100%}
#hud{position:fixed;top:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:4px 14px;border-radius:12px;font-size:14px;font-weight:800;display:flex;gap:10px;z-index:5}
#askBtn{position:fixed;top:12px;right:16px;padding:10px 18px;border-radius:20px;background:#00d2d3;color:#111;border:2px solid #fff;font-weight:900;font-size:13px;z-index:6}
#chatBtn{position:fixed;top:12px;left:16px;padding:9px 14px;border-radius:18px;background:#57606f;color:#fff;border:2px solid #fff;font-weight:900;font-size:12px;z-index:6}
#chatBox{display:none;position:fixed;top:50px;left:16px;background:rgba(14,18,24,.94);border:1px solid #57606f;border-radius:14px;padding:8px;z-index:15;width:255px;flex-direction:column;gap:6px}
.qmsg{border:0;border-radius:6px;padding:4px 7px;font-weight:800;font-size:11px;color:#111}
canvas{background:#1b6cb3;border-radius:16px;width:98vw;height:94vh;object-fit:contain}
#joy{position:fixed;left:22px;bottom:22px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35);z-index:5}
#kn{width:40px;height:40px;border-radius:50%;background:#ffd000;position:absolute;top:30px;left:30px;pointer-events:none}
.pad{position:fixed;right:18px;bottom:18px;width:165px;height:155px;z-index:5}
.pad button{position:absolute;border-radius:50%;color:#fff;border:2px solid #fff;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.45)}
#mB{width:84px;height:84px;right:0;bottom:0;font-size:11px}
#s1{width:62px;height:62px;right:94px;bottom:10px;font-size:9px}
#s2{width:62px;height:62px;right:68px;bottom:82px;font-size:10px;background:#2ed573}
</style></head><body>
<div id="menu">
  <div style="font-size:18px;font-weight:900;color:#ffd000">🐧 TUX FLOORBALL ONLINE 🏒</div>
  <div class="card">
    <div class="row"><span>Формат и время:</span>
      <select id="md"><option value="5v5">5 на 5 (IFF)</option><option value="3v3">3 на 3</option><option value="1v1">1 на 1</option></select>
      <select id="dur"><option value="60">1 мин</option><option value="120" selected>2 мин</option><option value="180">3 мин</option></select>
    </div>
    <div class="row"><span>Позиция и Боты:</span>
      <select id="role"><option value="field">Полевой</option><option value="gk">Вратарь</option></select>
      <select id="diff"><option value="0.78">Боты: Лёгкие</option><option value="1" selected>Боты: Норм</option><option value="1.22">Боты: Профи</option></select>
    </div>
    <div class="row"><span>Команда и Опции:</span>
      <select id="tmSel"><option value="0">Жёлтые</option><option value="1">Красные</option></select>
      <label><input type="checkbox" id="isCap" checked> Капитан</label>
      <label><input type="checkbox" id="chaosCb" checked> 🎲 Приколы</label>
    </div>
    <div class="row"><span>Клуб / Твой номер:</span>
      <input id="tName" value="OMSK TIGERS" maxlength="14" style="width:140px">
      <input id="pNum" type="number" value="10" min="1" max="99">
    </div>
    <div id="lobby">Подключение к лобби...</div>
    <div id="mChatLog" style="background:rgba(0,0,0,.45);border-radius:8px;padding:4px 8px;font-size:11px;height:44px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;color:#dfe4ea"></div>
    <div style="display:flex;gap:4px">
      <input id="mChatInp" placeholder="Написать в чат лобби..." maxlength="26" style="font-size:11px">
      <button id="mChatSend" style="background:#00d2d3;color:#111;border:0;border-radius:7px;padding:0 12px;font-weight:900">➤</button>
    </div>
    <button class="big" id="go">ВЫЙТИ НА ПЛОЩАДКУ</button>
  </div>
</div>
<div id="end"><h2 id="res">ПОБЕДА!</h2><div id="fsc" style="font-size:22px;font-weight:900;text-align:center"></div><button class="big" style="max-width:220px" id="re">В МЕНЮ</button></div>
<div id="hud"><span id="n1" style="color:#ffd000">OMSK TIGERS</span> <span id="sp">0</span>:<span id="sb">0</span> <span id="n2" style="color:#ff6b81">RED BEARS</span> | <span id="tm">02:00</span></div>
<div id="evBanner" style="display:none;position:fixed;top:36px;left:50%;transform:translateX(-50%);background:#ff4757;color:#fff;padding:3px 12px;border-radius:10px;font-size:12px;font-weight:900;z-index:5"></div>
<button id="chatBtn">💬 ЧАТ</button>
<div id="gChatLog" style="position:fixed;top:48px;left:16px;font-size:11px;font-weight:800;text-shadow:1px 1px 2px #000;pointer-events:none;z-index:5;display:flex;flex-direction:column;gap:2px"></div>
<div id="chatBox">
  <div style="display:flex;flex-wrap:wrap;gap:4px">
    <button class="qmsg" style="background:#2ed573">КРАСАВА! 🔥</button>
    <button class="qmsg" style="background:#ffd000">СЮДА! 🎯</button>
    <button class="qmsg" style="background:#ff6b81">ЭХ... 😅</button>
    <button class="qmsg" style="background:#70a1ff">ЗАЩИТА! 🛡️</button>
    <button class="qmsg" style="background:#a29bfe">ГГ! 🤝</button>
  </div>
  <div style="display:flex;gap:4px"><input id="cInp" placeholder="Своё сообщение..." maxlength="26" style="font-size:11px"><button id="cSend" style="background:#00d2d3;color:#111;border:0;border-radius:7px;padding:0 10px;font-weight:900">➤</button></div>
</div>
<button id="askBtn">ПАС!</button>
<canvas id="c" width="900" height="450"></canvas>
<div id="joy"><div id="kn"></div></div>
<div class="pad"><button id="s2">РЫВОК</button><button id="s1">СМЕНА</button><button id="mB">ПАС/УДАР</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),GL=115,GR=785;
const COLS=['#00ff88','#ff007f','#00e5ff','#ff9f1a','#c56cf0'];
const rc=()=>COLS.at(Math.random()*5|0);
const myId='p_'+Math.random().toString(36).slice(2,7);
let sP=0,sB=0,tLeft=120,over=1,goalT=0,gTxt='',k={},joy={x:0,y:0},jid=null,chg=0,isC=0,own=null,cd=0,actIdx=0;
let outMsg=null,chatList=[],evName='',evT=0,evCd=16,chaosOn=1,shake=0,swCd=0,dt=0,last=0,btT=0,dT=0,stm=1,pkT=0,askT=0,atkUI='',ac=null,pts=[],myTeam=0,myNum=10,myRole='field',myCap=1,botMult=1,gameMode='5v5',lanPeers={},isHost=1,netAct=null;

const mkTeam=(tm,col)=>Array.from({length:5},(_,i)=>({x:0,y:0,bx:0,by:0,r:14,a:tm?3.14:0,s:250,c:col,h:rc(),t:tm,num:(7+i*4),ai:1,cap:0,uid:null}));
const tP=mkTeam(0,'#ffd000'),tB=mkTeam(1,'#ff5252');
const gL={x:GL+16,y:225,bx:GL+16,by:225,r:14,a:0,s:175,c:'#4cd137',t:0,gk:1,num:1,ai:1,cap:0,uid:null};
const gR={x:GR-16,y:225,bx:GR-16,by:225,r:14,a:3.14,s:175,c:'#ff9f43',t:1,gk:1,num:30,ai:1,cap:0,uid:null};
const b={x:450,y:225,vx:0,vy:0,sp:0,r:7,pwr:0};const ref={x:450,y:85,r:13,a:1.57,arm:0};
const mB=document.getElementById('mB'),s1=document.getElementById('s1'),s2=document.getElementById('s2'),askBtn=document.getElementById('askBtn');

function sfx(f,d,tp='sine',v=.12){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=tp;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*.4,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function boom(gx,col){for(let i=0;i<24;i++){const a=Math.random()*6.28,sp=80+Math.random()*220;pts.push({x:gx,y:225,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:i%2?col:'#fff'});}}

const cBox=document.getElementById('chatBox'),cInp=document.getElementById('cInp'),mCInp=document.getElementById('mChatInp');
document.getElementById('chatBtn').onclick=()=>{cBox.style.display=cBox.style.display==='flex'?'none':'flex';};
function renderChat(){
  const html=chatList.slice(-4).map(m=>`<div><span style="color:#ffd000">#${m.num}:</span> ${m.txt}</div>`).join('');
  document.getElementById('mChatLog').innerHTML=html||'<span style="color:#747d8c">Чат пуст...</span>';
  document.getElementById('gChatLog').innerHTML=html;
}
function sendChat(t){if(!t)return;outMsg=t;chatList.push({id:myId,num:+document.getElementById('pNum').value||myNum,txt:t,loc:Date.now()});renderChat();cBox.style.display='none';cInp.value='';sfx(680,.06);}
document.querySelectorAll('.qmsg').forEach(btn=>btn.onclick=()=>sendChat(btn.textContent));
document.getElementById('cSend').onclick=()=>sendChat(cInp.value.trim());
cInp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')sendChat(cInp.value.trim());};
document.getElementById('mChatSend').onclick=()=>{sendChat(mCInp.value.trim());mCInp.value='';};
mCInp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'){sendChat(mCInp.value.trim());mCInp.value='';}};

const teamRoster=tm=>{const cnt=gameMode==='5v5'?5:(gameMode==='3v3'?3:1);return [...(tm?tB:tP).slice(0,cnt),tm?gR:gL];};
const myP=()=>teamRoster(myTeam).at(actIdx)||teamRoster(myTeam).at(0);

document.getElementById('tmSel').onchange=e=>{const tm=+e.target.value,inp=document.getElementById('tName');if(tm===1&&inp.value==='OMSK TIGERS')inp.value='RED BEARS';if(tm===0&&inp.value==='RED BEARS')inp.value='OMSK TIGERS';};

setInterval(async()=>{
  const me=myP(),selTm=+document.getElementById('tmSel').value,capCb=document.getElementById('isCap');
  const capTaken=Object.entries(lanPeers).some(([id,pl])=>id!==myId&&pl.tm===selTm&&pl.cap);
  if(capTaken){capCb.checked=false;capCb.disabled=true;}else{capCb.disabled=false;}
  const isCNow=capCb.checked?1:0;
  ['md','dur','diff','tName','chaosCb'].forEach(id=>document.getElementById(id).disabled=!isCNow);
  const cfg=isCNow?{md:document.getElementById('md').value,dur:+document.getElementById('dur').value,diff:+document.getElementById('diff').value,chaos:document.getElementById('chaosCb').checked?1:0}:null;
  const payload={x:me.x,y:me.y,a:me.a,tm:over?selTm:myTeam,num:+document.getElementById('pNum').value||10,role:over?document.getElementById('role').value:(me.gk?'gk':'field'),cap:isCNow,tname:document.getElementById('tName').value.trim(),inGame:!over,act:netAct};
  const msgSend=outMsg;netAct=null;outMsg=null;
  const world=isHost&&!over?{bx:b.x,by:b.y,sp:sP,sb:sB,tl:tLeft,own:own?own.uid:null,pwr:b.pwr,gt:goalT,gtxt:gTxt,ev:evName,over}:null;
  try{
    const r=await fetch('/sync',{method:'POST',body:JSON.stringify({id:myId,me:payload,cfg,world,msg:msgSend})});
    const d=await r.json();lanPeers=d.p||{};isHost=(d.host===myId);
    document.getElementById('n1').textContent=d.t1||'OMSK TIGERS';document.getElementById('n2').textContent=d.t2||'RED BEARS';
    if(d.chat&&d.chat.length){chatList=d.chat.map(m=>({...m,loc:Date.now()}));renderChat();}
    if(over){
      if(!isCNow){
        if(d.md)document.getElementById('md').value=d.md;if(d.dur)document.getElementById('dur').value=String(d.dur);
        if(d.diff)document.getElementById('diff').value=String(d.diff);if(d.chaos!==undefined)document.getElementById('chaosCb').checked=!!d.chaos;
        document.getElementById('tName').value=selTm?(d.t2||'RED BEARS'):(d.t1||'OMSK TIGERS');
      }
      const lb=document.getElementById('lobby'),list=Object.entries(lanPeers);
      lb.innerHTML=list.length?list.map(([id,pl])=>`<span class="tag" style="border:1px solid ${pl.tm?'#ff5252':'#ffd000'}">#${pl.num} ${pl.role==='gk'?'ВРТ':'ПОЛ'}${pl.cap?' (C)':''}${id===myId?' [ТЫ]':''}</span>`).join(''):'Только ты в сети';
    }else if(!isHost&&d.world){
      b.x=d.world.bx;b.y=d.world.by;b.pwr=d.world.pwr;sP=d.world.sp;sB=d.world.sb;tLeft=d.world.tl;goalT=d.world.gt;gTxt=d.world.gtxt;evName=d.world.ev||'';
      document.getElementById('sp').textContent=sP;document.getElementById('sb').textContent=sB;
      own=[...tP,...tB,gL,gR].find(e=>e.uid&&e.uid===d.world.own)||null;
    }
  }catch(e){isHost=1;if(over)document.getElementById('lobby').textContent='Офлайн режим';}
},80);
document.getElementById('go').onclick=async()=>{
  gameMode=document.getElementById('md').value;myRole=document.getElementById('role').value;
  myTeam=+document.getElementById('tmSel').value;myCap=document.getElementById('isCap').checked?1:0;
  botMult=+document.getElementById('diff').value;chaosOn=document.getElementById('chaosCb').checked?1:0;
  myNum=Math.max(1,Math.min(99,+document.getElementById('pNum').value||10));
  document.getElementById('menu').style.display='none';sP=sB=0;evName='';evT=0;evCd=12;tLeft=+document.getElementById('dur').value;
  document.getElementById('sp').textContent=0;document.getElementById('sb').textContent=0;over=0;rst();sfx(440,.1);
  try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape');}catch(e){}
};
document.getElementById('re').onclick=()=>{over=1;document.getElementById('end').style.display='none';document.getElementById('menu').style.display='flex';};

function rst(){
  tP.forEach((e,i)=>{e.x=e.bx=340-(i%2)*85;e.y=e.by=110+i*58;e.a=0;e.h=rc();e.ai=1;e.cap=0;e.uid=null;e.num=7+i*4;e.s=255*botMult;});
  tB.forEach((e,i)=>{e.x=e.bx=560+(i%2)*85;e.y=e.by=110+i*58;e.a=3.14;e.h=rc();e.ai=1;e.cap=0;e.uid=null;e.num=7+i*4;e.s=225*botMult;});
  gL.x=gL.bx=GL+16;gL.y=gL.by=225;gL.ai=1;gL.uid=null;gL.num=1;gL.s=165*botMult;
  gR.x=gR.bx=GR-16;gR.y=gR.by=225;gR.ai=1;gR.uid=null;gR.num=30;gR.s=165*botMult;
  const ros=teamRoster(myTeam);actIdx=myRole==='gk'?ros.length-1:0;
  const me=myP();me.ai=0;me.uid=myId;me.num=myNum;me.cap=myCap;me.s=me.gk?195:265;
  own=null;chg=isC=cd=dT=pkT=askT=shake=0;stm=1;b.x=450;b.y=225;b.vx=b.vy=b.sp=b.pwr=0;
}
function canSwitch(){const ros=teamRoster(myTeam);return ros.some((e,i)=>i!==actIdx&&e.ai&&!e.uid);}
function mode(st){
  const swOk=canSwitch(),key=st+'_'+(swOk?1:0);if(atkUI===key)return;atkUI=key;const p=myP();
  askBtn.style.display=(own===p?'none':'block');
  if(p.gk){mB.textContent=own===p?'БРОСОК':'ПРЫЖОК';mB.style.background='#2ed573';s1.textContent=swOk?'СМЕНА':'ЗАНЯТО';s1.style.background=swOk?'#1e90ff':'#57606f';return;}
  mB.textContent=st==='atk'?'ПАС/УДАР':'ОТБОР';mB.style.background=st==='atk'?'#ff4757':'#ffa502';
  s1.textContent=st==='atk'?'ФИНТ':(swOk?'СМЕНА':'НЕТ СМЕНЫ');s1.style.background=st==='atk'?'#a55eea':(swOk?'#1e90ff':'#57606f');
}
function askPass(){askT=1.3;sfx(780,.07);const p=myP();if(own&&own!==p&&own.t===myTeam&&own.ai){const a=Math.atan2(p.y-own.y,p.x-own.x);b.vx=Math.cos(a)*540;b.vy=Math.sin(a)*540;own=null;cd=.2;}}
function mDown(){const p=myP();if(own===p){isC=1;chg=.01;}else{pkT=.22;dT=.15;sfx(260,.08,'triangle',.08);if(!isHost)netAct={tp:'poke',a:p.a};if(!p.gk){const t=tip(p,p.a);if(Math.hypot(b.x-t.x,b.y-t.y)<36){own=p;cd=.18;sfx(520,.06);}}}}
function mUp(){if(!isC)return;const p=myP();if(own===p){const isP=!p.gk&&chg<.24,a=p.a,pw=p.gk?500+Math.min(1,chg)*300:(isP?530:440+Math.min(1,chg)*560),sp=p.gk||isP?0:(joy.y||0)*2.2,pwr=!p.gk&&!isP&&chg>=.88?1:0;if(!isHost)netAct={tp:'shot',a,pw,sp,pwr};b.vx=Math.cos(a)*pw;b.vy=Math.sin(a)*pw;b.sp=sp;b.pwr=pwr;b.x+=Math.cos(a)*15;b.y+=Math.sin(a)*15;own=null;cd=.22;sfx(pwr?120:(isP?420:190),pwr?.24:(isP?.08:.16),'triangle',.18);if(isP&&canSwitch())doSwitch();}isC=chg=0;}
function doSwitch(){if(!canSwitch())return;const ros=teamRoster(myTeam),old=myP();old.ai=1;old.uid=null;for(let s=1;s<=ros.length;s++){const nxt=(actIdx+s)%ros.length;if(ros.at(nxt).ai&&!ros.at(nxt).uid){actIdx=nxt;break;}}const np=myP();np.ai=0;np.uid=myId;np.s=np.gk?195:265;isC=chg=0;sfx(560,.06);}
function s1Act(){const p=myP();if(!p.gk&&own===p){if(isC)isC=chg=0;p.a+=2.3*(joy.y<0?-1:1);b.sp=3.8;dT=.12;sfx(620,.09,'sine',.1);}else{doSwitch();}}
const dash=()=>{if(stm>=.32&&dT<=0){dT=.22;stm-=.32;sfx(300,.1,'sawtooth',.06);}};
addEventListener('keydown',e=>{k[e.code]=1;if(e.code==='Space'&&!isC)mDown();if(e.code==='KeyC')askPass();if(e.code==='KeyQ'||e.code==='Tab'||e.code==='Escape'){e.preventDefault();s1Act();}if(e.code==='ShiftLeft')dash();});
addEventListener('keyup',e=>{k[e.code]=0;if(e.code==='Space')mUp();});
const jz=document.getElementById('joy'),kn=document.getElementById('kn');
function uJ(cx,cy){const r=jz.getBoundingClientRect();let dx=cx-(r.left+52),dy=cy-(r.top+52),d=Math.hypot(dx,dy);if(d>34){dx=dx/d*34;dy=dy/d*34;}kn.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/34;joy.y=dy/34;}
jz.onpointerdown=e=>{jid=e.pointerId;jz.setPointerCapture(jid);uJ(e.clientX,e.clientY);};jz.onpointermove=e=>{if(e.pointerId===jid)uJ(e.clientX,e.clientY);};jz.onpointerup=jz.onpointercancel=e=>{if(e.pointerId===jid){jid=null;joy={x:0,y:0};kn.style.transform='translate(0,0)';}};
mB.onpointerdown=e=>{e.preventDefault();mDown();};mB.onpointerup=mB.onpointercancel=e=>{e.preventDefault();mUp();};s1.onpointerdown=e=>{e.preventDefault();s1Act();};s2.onpointerdown=e=>{e.preventDefault();dash();};askBtn.onpointerdown=e=>{e.preventDefault();askPass();};
function pushBox(e,x1,y1,x2,y2){const cx=Math.max(x1,Math.min(x2,e.x)),cy=Math.max(y1,Math.min(y2,e.y)),dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);if(d<e.r){if(d>0){e.x=cx+dx/d*e.r;e.y=cy+dy/d*e.r;}else{e.x=x1-e.r;}}}
