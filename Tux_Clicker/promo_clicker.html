<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tux Clicker — Промо-видео</title><style>*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#09111e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}canvas{width:100%;max-width:800px;height:auto;border-radius:16px;border:2px solid #2b3f5e;box-shadow:0 12px 35px rgba(0,0,0,.6)}button{background:#2ed573;color:#111;border:0;border-bottom:4px solid #1e9e52;padding:12px 24px;border-radius:14px;font-weight:900;font-size:14px;cursor:pointer}button:disabled{opacity:.5}#st{font-size:13px;font-weight:800;color:#ffd000}</style></head><body><canvas id="c" width="800" height="450"></canvas><button id="recBtn" onclick="startRec()">ЗАПИСАТЬ И СКАЧАТЬ ВИДЕО (14 СЕК)</button><div id="st">Нажми кнопку — ролик сам запишется и сохранится в Загрузки</div><script>const c=document.getElementById("c"),x=c.getContext("2d");let t=0,rec=0,pops=[],fish=[],sc=1,ang=0;function drawFish(fx,fy,r,rot){x.save();x.translate(fx,fy);x.rotate(rot);x.scale(r,r);x.fillStyle="#ffd000";x.strokeStyle="#111";x.lineWidth=3;x.beginPath();x.ellipse(0,0,22,12,0,0,7);x.fill();x.stroke();x.beginPath();x.moveTo(-18,0);x.lineTo(-34,-11);x.lineTo(-34,11);x.closePath();x.fill();x.stroke();x.fillStyle="#111";x.beginPath();x.arc(10,-2,2.5,0,7);x.fill();x.restore();}function drawCursor(cx,cy,clk){x.save();x.translate(cx,cy);x.scale(clk?.85:1.05,clk?.85:1.05);if(clk){x.strokeStyle="#ffd000";x.lineWidth=5;x.beginPath();x.arc(0,0,26,0,7);x.stroke();}x.fillStyle="#fff";x.strokeStyle="#111";x.lineWidth=6;x.lineJoin="round";x.beginPath();x.moveTo(0,0);x.lineTo(0,68);x.lineTo(17,51);x.lineTo(29,78);x.lineTo(42,72);x.lineTo(30,45);x.lineTo(52,45);x.closePath();x.fill();x.stroke();x.restore();}function drawTux(px,py,scale,hockey,now,fisher){x.save();x.translate(px,py);x.scale(scale,scale);x.fillStyle="rgba(0,0,0,.25)";x.beginPath();x.ellipse(0,80,56,13,0,0,7);x.fill();x.fillStyle="#ff9f1a";x.beginPath();x.ellipse(-28,74,21,10,-.18,0,7);x.ellipse(28,74,21,10,.18,0,7);x.fill();x.strokeStyle="#b36b00";x.lineWidth=2;x.stroke();const bg=x.createLinearGradient(-55,-65,55,80);bg.addColorStop(0,hockey?"#e84118":"#2f3542");bg.addColorStop(1,"#0b0f17");x.fillStyle=bg;x.beginPath();x.ellipse(0,8,64,74,0,0,7);x.fill();x.strokeStyle="#090c12";x.lineWidth=3;x.stroke();x.fillStyle="#fff";x.beginPath();x.ellipse(0,18,42,54,0,0,7);x.fill();if(hockey){x.fillStyle="#e84118";x.beginPath();x.roundRect(-51,-12,102,44,14);x.fill();x.strokeStyle="#111";x.lineWidth=2.5;x.stroke();x.fillStyle="#fff";x.fillRect(-49,18,98,6);x.fillStyle="#111";x.font="900 18px sans-serif";x.textAlign="center";x.fillText("10",0,11);}const fl=Math.sin(now/160)*0.15;x.fillStyle=hockey?"#e84118":"#2f3542";x.beginPath();x.ellipse(-66,8,15,35,.32+fl,0,7);x.ellipse(66,8,15,35,-.32-fl,0,7);x.fill();x.fillStyle="rgba(255,107,129,.5)";x.beginPath();x.ellipse(-30,-20,9,5,0,0,7);x.ellipse(30,-20,9,5,0,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(-18,-38,11.5,0,7);x.arc(18,-38,11.5,0,7);x.fill();x.fillStyle="#111";x.beginPath();x.arc(-16,-38,5.8,0,7);x.arc(20,-38,5.8,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(-18,-40,2.3,0,7);x.arc(18,-40,2.3,0,7);x.fill();x.fillStyle="#ff9f1a";x.beginPath();x.moveTo(-16,-23);x.lineTo(16,-23);x.lineTo(0,-4);x.closePath();x.fill();if(fisher){x.strokeStyle="#8c6239";x.lineWidth=4;x.beginPath();x.moveTo(-45,20);x.lineTo(-95,-30);x.stroke();x.strokeStyle="#fff";x.lineWidth=1.5;x.beginPath();x.moveTo(-95,-30);x.lineTo(-95,70);x.stroke();}if(hockey){x.fillStyle="#1e272e";x.beginPath();x.arc(0,-46,39,Math.PI,0);x.fill();x.fillStyle="rgba(0,229,255,.38)";x.beginPath();x.roundRect(-36,-48,72,15,6);x.fill();x.strokeStyle="#2f3640";x.lineWidth=7;x.lineCap="round";x.beginPath();x.moveTo(46,-28);x.lineTo(76,72);x.stroke();x.strokeStyle="#fff";x.lineWidth=8;x.beginPath();x.moveTo(46,-28);x.lineTo(51,-11);x.stroke();x.fillStyle="#111";x.beginPath();x.roundRect(73,65,36,11,4);x.fill();x.fillStyle="#fff";x.fillRect(83,65,5,11);x.fillRect(94,65,5,11);}x.restore();}let lastClk=0;function loop(now){t+=0.016;if(t>14&&!rec)t=0;sc+=(1-sc)*0.22;ang*=0.85;const hockey=t>=7.5,helper=t>=3.5,score=Math.min(50000,Math.floor(t*t*260));const sky=x.createLinearGradient(0,0,0,235);sky.addColorStop(0,"#091326");sky.addColorStop(0.55,"#1b4f72");sky.addColorStop(1,"#f39c12");x.fillStyle=sky;x.fillRect(0,0,800,235);x.fillStyle="#8395a7";x.beginPath();x.moveTo(0,230);x.lineTo(120,115);x.lineTo(260,230);x.lineTo(450,95);x.lineTo(630,230);x.lineTo(740,125);x.lineTo(800,200);x.lineTo(800,240);x.lineTo(0,240);x.fill();const sea=x.createLinearGradient(0,230,0,450);sea.addColorStop(0,"#1e90ff");sea.addColorStop(1,"#0a1931");x.fillStyle=sea;x.fillRect(0,230,800,220);x.fillStyle="#74b9ff";x.beginPath();x.ellipse(360,375,165,38,0,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.ellipse(360,365,156,28,0,0,7);x.fill();if(helper){x.fillStyle="#74b9ff";x.beginPath();x.ellipse(610,360,64,18,0,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.ellipse(610,355,58,13,0,0,7);x.fill();drawTux(610,305,0.58,0,now,1);}x.save();x.translate(360,260+Math.sin(now/240)*4);x.rotate(ang);x.scale(sc,sc);drawTux(0,0,1.42,hockey,now,0);x.restore();const clk=(t<11)&&(Math.floor(t*3.5)!==lastClk);if(clk){lastClk=Math.floor(t*3.5);sc=0.86;ang=(Math.random()-.5)*.22;pops.push({x:340+(Math.random()-.5)*60,y:175,txt:hockey?"CRIT +500!":"+50",l:1,c:hockey?"#ff4757":"#ffd000"});fish.push({x:360,y:230,vx:(Math.random()-.5)*220,vy:-180-Math.random()*110,r:Math.random()*6});}fish.forEach(f=>{f.x+=f.vx*.016;f.y+=f.vy*.016;f.vy+=420*.016;drawFish(f.x,f.y,0.75,f.r);});fish=fish.filter(f=>f.y<470);pops.forEach(p=>{p.y-=1.8;p.l-=0.025;x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.font="900 24px sans-serif";x.textAlign="center";x.fillText(p.txt,p.x,p.y);});x.globalAlpha=1;pops=pops.filter(p=>p.l>0);if(t<11)drawCursor(405,275+Math.sin(t*22)*10,clk);x.fillStyle="rgba(11,17,28,.85)";x.beginPath();x.roundRect(260,14,280,44,14);x.fill();x.fillStyle="#ffd000";x.font="900 24px sans-serif";x.textAlign="center";x.fillText(score.toLocaleString()+" FISH",400,44);if(t>7.3&&t<9.2){x.fillStyle="#2ed573";x.strokeStyle="#111";x.lineWidth=6;x.font="900 42px sans-serif";x.strokeText("EVOLUTION!",400,115);x.fillText("EVOLUTION!",400,115);}if(t>=11){x.fillStyle="rgba(9,17,30,.72)";x.fillRect(0,0,800,450);x.fillStyle="#ffd000";x.strokeStyle="#111";x.lineWidth=8;x.font="900 62px sans-serif";x.strokeText("TUX CLICKER",400,205);x.fillText("TUX CLICKER",400,205);x.fillStyle="#7bed9f";x.font="900 26px sans-serif";x.fillText("TAP • EVOLVE • TOP 1",400,255);}requestAnimationFrame(loop);}requestAnimationFrame(loop);function startRec(){if(rec)return;rec=1;t=0;pops=[];fish=[];const btn=document.getElementById("recBtn"),st=document.getElementById("st");btn.disabled=true;st.textContent="Запись идёт (14 сек)...";const mr=new MediaRecorder(c.captureStream(30)),ch=[];mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};mr.onstop=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(ch,{type:"video/webm"}));a.download="tux_clicker_promo.webm";a.click();rec=0;btn.disabled=false;st.textContent="Готово! Файл tux_clicker_promo.webm в Загрузках.";};mr.start();setTimeout(()=>mr.stop(),14000);}</script></body></html>
