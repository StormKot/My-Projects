<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tux Clicker</title><script src="/sdk.js"></script><style>*{box-sizing:border-box;user-select:none;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:#08162b;color:#fff;height:100vh;overflow:hidden;touch-action:manipulation;position:relative}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.topBar{position:fixed;top:10px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:6px;z-index:5;pointer-events:none}.pill{background:rgba(13,22,38,.88);border:2px solid #34495e;border-bottom-width:4px;border-radius:14px;padding:6px 11px;font-weight:900;font-size:15px;color:#ffd000;pointer-events:auto;display:flex;align-items:center;gap:6px}.lvlBox{flex:1;max-width:340px;background:rgba(13,22,38,.88);border:2px solid #34495e;border-bottom-width:4px;border-radius:14px;padding:5px 10px;text-align:center}.lvlTitle{font-size:11px;font-weight:900;color:#7bed9f}.pBar{height:12px;background:#070d17;border-radius:7px;margin-top:4px;position:relative;overflow:hidden}.pFill{height:100%;width:0%;background:linear-gradient(90deg,#2ed573,#00d2d3);transition:width .15s}.pTxt{position:absolute;inset:0;font-size:9px;font-weight:900;line-height:12px;color:#fff}.iconBtn{background:#5352ed;border:2px solid #3742fa;border-bottom-width:4px;border-radius:14px;padding:7px 10px;color:#fff;font-weight:900;font-size:11px;pointer-events:auto;cursor:pointer}.iconBtn:active,.btn3d:active{transform:translateY(2px);border-bottom-width:2px}.tvFocus{outline:3px solid #ffd000 !important;outline-offset:2px}.dock{position:fixed;left:10px;right:10px;bottom:64px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px;z-index:5}.adRow{display:flex;gap:6px}.shopRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.btn3d{border:0;border-bottom:4px solid rgba(0,0,0,.4);border-radius:14px;padding:9px 6px;font-weight:900;font-size:11px;color:#fff;text-align:center;cursor:pointer;line-height:1.2}.btn3d:disabled{opacity:.48;transform:none}.btn3d b{display:block;font-size:13px;margin-top:2px;color:#ffd000}@media(orientation:landscape)and(min-width:540px){.dock{inset:0;max-width:none;pointer-events:none}.adRow{position:fixed;left:12px;top:52%;transform:translateY(-50%);width:152px;flex-direction:column;pointer-events:auto}.shopRow{position:fixed;right:12px;top:44%;transform:translateY(-50%);width:162px;grid-template-columns:1fr;pointer-events:auto}#uEvo{position:fixed;right:12px;bottom:64px;width:162px;pointer-events:auto}}</style></head><body oncontextmenu="return false;"><canvas id="c"></canvas><div class="topBar"><div class="pill"><span id="cTxt">0</span><span style="font-size:10px;color:#a4b0be" id="dpsTxt">+1 / +0с</span></div><div class="lvlBox"><div class="lvlTitle" id="lvlTxt">УР. 1 • ПИНГВИНЁНОК TUX</div><div class="pBar"><div class="pFill" id="eFill"></div><div class="pTxt" id="eTxt">0 / 500</div></div></div><div style="display:flex;gap:4px;pointer-events:auto"><button class="iconBtn" id="lngBtn" style="background:#2f3542;border-color:#57606f" onclick="toggleL()">RU</button><button class="iconBtn" id="lbBtn" onclick="openLb()">ТОП</button></div></div><div class="dock"><div class="adRow"><button class="btn3d" id="bX2" style="flex:1;background:#10ac84" onclick="rewX2()">x2 ДОХОД 60с (РЕКЛАМА)</button><button class="btn3d" id="bBox" style="flex:1;background:#ee5253" onclick="rewBox()">СУНДУК РЫБОК (РЕКЛАМА)</button></div><div class="shopRow"><button class="btn3d" id="uTap" style="background:#162233;border:1px solid #2e4057" onclick="buyTap()"><span id="tLbl">КЛИК</span><b id="tCost">25</b></button><button class="btn3d" id="uAuto" style="background:#162233;border:1px solid #2e4057" onclick="buyAuto()"><span id="aLbl">ФЕРМА</span><b id="aCost">100</b></button><button class="btn3d" id="uCrit" style="background:#162233;border:1px solid #2e4057" onclick="buyCrit()"><span id="crLbl">КРИТ 5%</span><b id="crCost">250</b></button></div><button class="btn3d" id="uEvo" style="background:#ff9f1a;color:#111;font-size:13px;padding:11px" onclick="buyEvo()"><span id="eLbl">ЭВОЛЮЦИЯ ПИНГВИНА</span> — <span id="eCost">500</span></button></div><script>const c=document.getElementById("c"),x=c.getContext("2d");let coins=0,tapP=1,autoP=0,critC=0.05,evo=0,combo=0,x2T=0,cdX2=0,cdBox=0,sc=1,ang=0,shake=0,lang="ru",ysdk=null,ac=null,pops=[],boatFish=null,ripples=[];const EVOS=[{ru:"ПИНГВИНЁНОК TUX",en:"BABY TUX",c:"#2f3542",hat:0,cost:500},{ru:"ПИНГВИН-СКЕЙТЕР",en:"SKATER TUX",c:"#2f3542",hat:1,cost:4500},{ru:"ХОККЕИСТ TUX",en:"HOCKEY TUX",c:"#e84118",hat:2,cost:35000},{ru:"КАПИТАН ЛЬДИНЫ",en:"ICE CAPTAIN",c:"#1e90ff",hat:3,cost:280000},{ru:"КИБЕР-ПИНГВИН",en:"CYBER TUX",c:"#5352ed",hat:4,cost:2500000},{ru:"ЗОЛОТОЙ КОРОЛЬ",en:"GOLDEN KING",c:"#ffa502",hat:5,cost:25000000},{ru:"КОСМО-ПИНГВИН",en:"COSMIC TUX",c:"#00d2d3",hat:6,cost:250000000},{ru:"БОГ АРКТИКИ TUX",en:"ARCTIC GOD TUX",c:"#ff6b81",hat:7,cost:2500000000}];function sfx(f,d){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*.5,ac.currentTime+d);g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}const T={ru:{lvl:"УР.",sec:"с",x2:"x2 ДОХОД 60с (РЕКЛАМА)",box:"СУНДУК РЫБОК (РЕКЛАМА)",wait:"ЖДИ ",ut:"КЛИК",ua:"ФЕРМА",uc:"КРИТ",ue:"ЭВОЛЮЦИЯ ПИНГВИНА",max:"МАКС УРОВЕНЬ",lb:"ТОП",ttl:"Tux Clicker"},en:{lvl:"LVL",sec:"s",x2:"x2 INCOME 60s (AD)",box:"FISH CHEST (AD)",wait:"WAIT ",ut:"CLICK",ua:"FARM",uc:"CRIT",ue:"EVOLVE PENGUIN",max:"MAX LEVEL",lb:"TOP",ttl:"Tux Clicker"}};const tr=k=>T[lang][k]||k;let tCost=25,aCost=100,cCost=250,best=0,lbObj=null;try{const sv=JSON.parse(localStorage.getItem("tux_clk3")||"null");if(sv){coins=sv.c||0;tapP=sv.tp||1;autoP=sv.ap||0;critC=sv.cc||0.05;evo=sv.ev||0;tCost=sv.tc||25;aCost=sv.ac||100;cCost=sv.crc||250;best=sv.bs||0;}}catch(e){}function save(){best=Math.max(best,Math.floor(coins));try{localStorage.setItem("tux_clk3",JSON.stringify({c:coins,tp:tapP,ap:autoP,cc:critC,ev:evo,tc:tCost,ac:aCost,crc:cCost,bs:best}));}catch(e){}}function sendLb(){save();if(lbObj)try{lbObj.setLeaderboardScore("score",best);}catch(e){}}function openLb(){sendLb();if(ysdk?.getLeaderboards){ysdk.getLeaderboards().then(lb=>lb.getLeaderboardEntries("score",{quantityTop:5,includeUser:true})).then(r=>{alert((lang==="en"?"TOP:\n":"ТОП:\n")+r.entries.map(e=>`${e.rank}. ${e.player.publicName||"Tux"}: ${e.score}`).join("\n"));}).catch(()=>alert("Record: "+best));}else alert("Record: "+best);}function toggleL(){setL(lang==="ru"?"en":"ru");}function setL(l){lang=(l==="en"?"en":"ru");document.documentElement.lang=lang;document.title=tr("ttl");document.getElementById("lngBtn").textContent=lang.toUpperCase();document.getElementById("tLbl").textContent=tr("ut");document.getElementById("aLbl").textContent=tr("ua");document.getElementById("eLbl").textContent=tr("ue");document.getElementById("lbBtn").textContent=tr("lb");ui();}function ui(){const e=EVOS[evo],cm=1+Math.min(1.2,combo*0.08),m=(x2T>0?2:1)*cm,isMax=evo>=EVOS.length-1;document.getElementById("cTxt").textContent=Math.floor(coins).toLocaleString();document.getElementById("dpsTxt").textContent=`+${Math.round(tapP*m)} / +${Math.round(autoP*(x2T>0?2:1))}${tr("sec")}`;document.getElementById("lvlTxt").textContent=`${tr("lvl")} ${evo+1} • ${e[lang]}`;document.getElementById("tCost").textContent=tCost.toLocaleString();document.getElementById("aCost").textContent=aCost.toLocaleString();document.getElementById("crLbl").textContent=`${tr("uc")} ${Math.round(critC*100)}%`;document.getElementById("crCost").textContent=critC>=0.5?"MAX":cCost.toLocaleString();document.getElementById("eCost").textContent=isMax?tr("max"):e.cost.toLocaleString();document.getElementById("uTap").disabled=coins<tCost;document.getElementById("uAuto").disabled=coins<aCost;document.getElementById("uCrit").disabled=coins<cCost||critC>=0.5;document.getElementById("uEvo").disabled=coins<e.cost||isMax;const pct=isMax?100:Math.min(100,Math.floor(coins/e.cost*100));document.getElementById("eFill").style.width=pct+"%";document.getElementById("eTxt").textContent=isMax?tr("max"):`${Math.floor(coins).toLocaleString()} / ${e.cost.toLocaleString()}`;const bx=document.getElementById("bX2"),bb=document.getElementById("bBox");bx.disabled=cdX2>0;bx.textContent=cdX2>0?`${tr("wait")}${Math.ceil(cdX2)}${tr("sec")}`:tr("x2");bb.disabled=cdBox>0;bb.textContent=cdBox>0?`${tr("wait")}${Math.ceil(cdBox)}${tr("sec")}`:tr("box");}function rsz(){c.width=innerWidth;c.height=innerHeight;}rsz();addEventListener("resize",rsz);c.onpointerdown=ev=>{const px=ev.clientX,py=ev.clientY;if(boatFish&&Math.hypot(px-boatFish.x,py-boatFish.y)<45){const b=Math.max(20,tapP*15+autoP*6);coins+=b;pops.push({x:boatFish.x,y:boatFish.y-10,t:"+"+Math.floor(b),l:1,c:"#ffd000",sz:23});boatFish=null;sfx(920,.2);ui();return;}const isCrit=Math.random()<critC,cm=1+Math.min(1.2,combo*0.08),gain=Math.max(1,Math.round(tapP*(x2T>0?2:1)*cm*(isCrit?4:1)));coins+=gain;combo=Math.min(15,combo+1);sc=isCrit?0.82:0.9;ang=(Math.random()-.5)*(isCrit?.28:.16);if(isCrit)shake=0.16;ripples.push({x:c.width/2,y:c.height*0.44+88,r:40,l:1});pops.push({x:px,y:py-16,t:(isCrit?"CRIT +":"+") + gain,l:1,c:isCrit?"#ff4757":"#fff",sz:isCrit?25:19});sfx(isCrit?680:420+evo*35,.08);ui();};function buyTap(){if(coins>=tCost){coins-=tCost;tapP+=1+Math.floor(evo*0.8);tCost=Math.floor(tCost*1.58);sfx(580,.1);save();ui();}}function buyAuto(){if(coins>=aCost){coins-=aCost;autoP+=1+Math.floor(evo*1.2);aCost=Math.floor(aCost*1.65);sfx(620,.1);save();ui();}}function buyCrit(){if(coins>=cCost&&critC<0.5){coins-=cCost;critC=Math.min(0.5,critC+0.02);cCost=Math.floor(cCost*1.85);sfx(660,.1);save();ui();}}function buyEvo(){const e=EVOS[evo];if(coins>=e.cost&&evo<EVOS.length-1){coins-=e.cost;evo++;tapP=Math.floor(tapP*1.35)+1;autoP=Math.floor(autoP*1.35)+1;const go=()=>{if(ac)ac.resume();sfx(880,.3);sendLb();ui();};if(ysdk?.adv){try{ysdk.adv.showFullscreenAdv({callbacks:{onOpen:()=>{if(ac)ac.suspend();},onClose:go,onError:go}});}catch(er){go();}}else go();}}function rewX2(){if(cdX2>0)return;const ok=()=>{x2T=60;cdX2=90;sfx(700,.2);ui();};if(ysdk?.adv){try{ysdk.adv.showRewardedVideo({callbacks:{onOpen:()=>{if(ac)ac.suspend();},onRewarded:ok,onClose:()=>{if(ac)ac.resume();},onError:()=>{if(ac)ac.resume();}}});}catch(er){}}}function rewBox(){if(cdBox>0)return;const ok=()=>{coins+=Math.max(60,tapP*20+autoP*10);cdBox=90;sfx(750,.2);save();ui();};if(ysdk?.adv){try{ysdk.adv.showRewardedVideo({callbacks:{onOpen:()=>{if(ac)ac.suspend();},onRewarded:ok,onClose:()=>{if(ac)ac.resume();},onError:()=>{if(ac)ac.resume();}}});}catch(er){}}}setInterval(()=>{coins+=autoP*(x2T>0?2:1)*0.2;if(combo>0)combo=Math.max(0,combo-0.45);if(x2T>0)x2T=Math.max(0,x2T-0.2);if(cdX2>0)cdX2=Math.max(0,cdX2-0.2);if(cdBox>0)cdBox=Math.max(0,cdBox-0.2);if(!boatFish&&Math.random()<0.012)boatFish={x:-30,y:c.height*0.56+Math.random()*50,vx:85};ui();},200);setInterval(sendLb,15000);const tvBtns=["bX2","bBox","uTap","uAuto","uCrit","uEvo","lbBtn","lngBtn"];let tvIdx=-1;function updTv(){tvBtns.forEach((id,i)=>{const el=document.getElementById(id);if(el)el.classList.toggle("tvFocus",i===tvIdx);});}window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"," "].includes(e.key))e.preventDefault();if(e.key==="ArrowDown"){tvIdx=tvIdx<0?0:(tvIdx+1>=tvBtns.length?-1:tvIdx+1);updTv();}else if(e.key==="ArrowUp"){tvIdx=tvIdx<0?tvBtns.length-1:tvIdx-1;updTv();}else if(e.key==="ArrowRight"){tvIdx=(tvIdx+1)%tvBtns.length;updTv();}else if(e.key==="ArrowLeft"){tvIdx=tvIdx<=0?tvBtns.length-1:tvIdx-1;updTv();}else if(e.key==="Enter"||e.key===" "){if(tvIdx>=0){const el=document.getElementById(tvBtns[tvIdx]);if(el&&!el.disabled)el.click();}else{const tx=boatFish?boatFish.x:c.width/2,ty=boatFish?boatFish.y:c.height*0.42;c.onpointerdown({clientX:tx,clientY:ty});}}});function drawTux(px,py,scale,e,now,fisher){x.save();x.translate(px,py);x.scale(scale,scale);x.fillStyle="rgba(0,0,0,.22)";x.beginPath();x.ellipse(0,80,56,13,0,0,7);x.fill();x.fillStyle="#ff9f1a";x.beginPath();x.ellipse(-28,74,21,10,-.18,0,7);x.ellipse(28,74,21,10,.18,0,7);x.fill();x.strokeStyle="#b36b00";x.lineWidth=2;x.stroke();const bg=x.createLinearGradient(-55,-65,55,80);bg.addColorStop(0,e.c);bg.addColorStop(1,"#0b0f17");x.fillStyle=bg;x.beginPath();x.ellipse(0,8,64,74,0,0,7);x.fill();x.strokeStyle="#090c12";x.lineWidth=3;x.stroke();x.fillStyle="#fff";x.beginPath();x.ellipse(0,18,42,54,0,0,7);x.fill();if(e.hat===2){x.fillStyle="#e84118";x.beginPath();x.roundRect(-51,-12,102,44,14);x.fill();x.strokeStyle="#111";x.lineWidth=2.5;x.stroke();x.fillStyle="#fff";x.fillRect(-49,18,98,6);x.fillStyle="#111";x.font="900 18px sans-serif";x.textAlign="center";x.fillText("10",0,11);}const fl=Math.sin(now/180)*0.12;x.fillStyle=e.c;x.beginPath();x.ellipse(-66,8,15,35,.32+fl,0,7);x.ellipse(66,8,15,35,-.32-fl,0,7);x.fill();x.fillStyle="rgba(255,107,129,.5)";x.beginPath();x.ellipse(-30,-20,9,5,0,0,7);x.ellipse(30,-20,9,5,0,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(-18,-38,11.5,0,7);x.arc(18,-38,11.5,0,7);x.fill();x.fillStyle="#111";x.beginPath();x.arc(-16,-38,5.8,0,7);x.arc(20,-38,5.8,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(-18,-40,2.3,0,7);x.arc(18,-40,2.3,0,7);x.fill();x.fillStyle="#ff9f1a";x.beginPath();x.moveTo(-16,-23);x.lineTo(16,-23);x.lineTo(0,-4);x.closePath();x.fill();x.strokeStyle="#b36b00";x.lineWidth=2;x.stroke();if(fisher){x.strokeStyle="#8c6239";x.lineWidth=4;x.beginPath();x.moveTo(-45,20);x.lineTo(-95,-30);x.stroke();x.strokeStyle="#fff";x.lineWidth=1.5;x.beginPath();x.moveTo(-95,-30);x.lineTo(-95,70);x.stroke();}if(e.hat===1
