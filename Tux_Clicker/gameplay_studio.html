<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tux Clicker Studio</title><style>*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#0b121e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}button{border:0;border-bottom:3px solid rgba(0,0,0,.35);border-radius:11px;padding:8px 13px;font-weight:900;font-size:12px;color:#fff;background:#2f3542;cursor:pointer}.act{background:#5352ed}.rec{background:#2ed573;color:#111;font-size:13px;padding:10px 18px}button:disabled{opacity:.5}canvas{max-width:95vw;max-height:70vh;width:auto;height:auto;border-radius:14px;border:2px solid #2f3e52}#st{font-size:12px;color:#ffd000;font-weight:800;text-align:center}</style></head><body><div class="bar"><button id="mDesk" class="act">ДЕСКТОП (800×450)</button><button id="mMob">МОБИЛА (450×800)</button><button id="lRu" class="act">RU</button><button id="lEn">EN</button></div><canvas id="c" width="800" height="450"></canvas><button class="rec" id="recBtn">ЗАПИСАТЬ ГЕЙМПЛЕЙ (15 СЕК)</button><div id="st">Выбери платформу и язык, затем нажми запись</div><script>const c=document.getElementById("c"),x=c.getContext("2d");let mode="desk",lang="ru",t=0,rec=0,coins=0,tapP=5,autoP=0,evo=0,sc=1,ang=0,pops=[],fish=null,ptr={x:400,y:225,clk:0},btnFlash="",actStep=-1,lastClk=0;const L={ru:{lvl:["УР. 1 • ПИНГВИНЁНОК TUX","УР. 2 • ХОККЕИСТ TUX"],ut:"КЛИК",ua:"ФЕРМА",ue:"ЭВОЛЮЦИЯ",crit:"КРИТ +"},en:{lvl:["LVL 1 • BABY TUX","LVL 2 • HOCKEY TUX"],ut:"CLICK",ua:"FARM",ue:"EVOLVE",crit:"CRIT +"}};function rstSim(){t=0;coins=0;tapP=5;autoP=0;evo=0;pops=[];fish=null;actStep=-1;lastClk=0;ptr={x:c.width/2,y:c.height*0.42,clk:0};}function setCfg(m,l){if(rec)return;mode=m;lang=l;c.width=(m==="desk"?800:450);c.height=(m==="desk"?450:800);document.getElementById("mDesk").className=(m==="desk"?"act":"");document.getElementById("mMob").className=(m==="mob"?"act":"");document.getElementById("lRu").className=(l==="ru"?"act":"");document.getElementById("lEn").className=(l==="en"?"act":"");rstSim();}document.getElementById("mDesk").onclick=()=>setCfg("desk",lang);document.getElementById("mMob").onclick=()=>setCfg("mob",lang);document.getElementById("lRu").onclick=()=>setCfg(mode,"ru");document.getElementById("lEn").onclick=()=>setCfg(mode,"en");function drawTux(px,py,scale,hockey,now,fisher){x.save();x.translate(px,py);x.scale(scale,scale);x.fillStyle="rgba(0,0,0,.22)";x.beginPath();x.ellipse(0,80,56,13,0,0,7);x.fill();x.fillStyle="#ff9f1a";x.beginPath();x.ellipse(-28,74,21,10,-.18,0,7);x.ellipse(28,74,21,10,.18,0,7);x.fill();const bg=x.createLinearGradient(-55,-65,55,80);bg.addColorStop(0,hockey?"#e84118":"#2f3542");bg.addColorStop(1,"#0b0f17");x.fillStyle=bg;x.beginPath();x.ellipse(0,8,64,74,0,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.ellipse(0,18,42,54,0,0,7);x.fill();if(hockey){x.fillStyle="#e84118";x.beginPath();x.roundRect(-51,-12,102,44,14);x.fill();x.fillStyle="#fff";x.fillRect(-49,18,98,6);x.fillStyle="#111";x.font="900 18px sans-serif";x.textAlign="center";x.fillText("10",0,11);}const fl=Math.sin(now/160)*0.14;x.fillStyle=hockey?"#e84118":"#2f3542";x.beginPath();x.ellipse(-66,8,15,35,.32+fl,0,7);x.ellipse(66,8,15,35,-.32-fl,0,7);x.fill();x.fillStyle="rgba(255,107,129,.5)";x.beginPath();x.ellipse(-30,-20,9,5,0,0,7);x.ellipse(30,-20,9,5,0,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(-18,-38,11.5,0,7);x.arc(18,-38,11.5,0,7);x.fill();x.fillStyle="#111";x.beginPath();x.arc(-16,-38,5.8,0,7);x.arc(20,-38,5.8,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(-18,-40,2.3,0,7);x.arc(18,-40,2.3,0,7);x.fill();x.fillStyle="#ff9f1a";x.beginPath();x.moveTo(-16,-23);x.lineTo(16,-23);x.lineTo(0,-4);x.closePath();x.fill();if(fisher){x.strokeStyle="#8c6239";x.lineWidth=4;x.beginPath();x.moveTo(-45,20);x.lineTo(-95,-30);x.stroke();x.strokeStyle="#fff";x.lineWidth=1.5;x.beginPath();x.moveTo(-95,-30);x.lineTo(-95,70);x.stroke();}if(hockey){x.fillStyle="#1e272e";x.beginPath();x.arc(0,-46,39,Math.PI,0);x.fill();x.fillStyle="rgba(0,229,255,.38)";x.beginPath();x.roundRect(-36,-48,72,15,6);x.fill();x.strokeStyle="#2f3640";x.lineWidth=7;x.lineCap="round";x.beginPath();x.moveTo(46,-28);x.lineTo(76,72);x.stroke();x.strokeStyle="#fff";x.lineWidth=8;x.beginPath();x.moveTo(46,-28);x.lineTo(51,-11);x.stroke();x.fillStyle="#111";x.beginPath();x.roundRect(73,65,36,11,4);x.fill();x.fillStyle="#fff";x.fillRect(83,65,5,11);x.fillRect(94,65,5,11);}x.restore();}function drawBtn(bx,by,bw,bh,col,t1,t2,id){x.save();if(btnFlash===id)x.translate(0,2);x.fillStyle=col;x.beginPath();x.roundRect(bx,by,bw,bh,12);x.fill();x.fillStyle="#fff";x.font="900 11px sans-serif";x.textAlign="center";x.fillText(t1,bx+bw/2,by+17);x.fillStyle="#ffd000";x.font="900 13px sans-serif";x.fillText(t2,bx+bw/2,by+34);x.restore();}function drawPtr(){x.save();x.translate(ptr.x,ptr.y);if(mode==="mob"){x.fillStyle=ptr.clk?"rgba(255,255,255,.8)":"rgba(255,255,255,.4)";x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.arc(0,0,ptr.clk?16:22,0,7);x.fill();x.stroke();}else{x.scale(ptr.clk?.88:1,ptr.clk?.88:1);x.fillStyle="#fff";x.strokeStyle="#111";x.lineWidth=3;x.beginPath();x.moveTo(0,0);x.lineTo(0,26);x.lineTo(7,20);x.lineTo(12,30);x.lineTo(17,28);x.lineTo(12,18);x.lineTo(20,18);x.closePath();x.fill();x.stroke();}x.restore();}function loop(now){t+=0.016;if(t>15&&!rec)rstSim();sc+=(1-sc)*0.22;ang*=0.85;coins+=autoP*0.016;const W=c.width,H=c.height,cx=W/2,cy=H*(mode==="desk"?0.46:0.39),txt=L[lang];const sky=x.createLinearGradient(0,0,0,H*0.48);sky.addColorStop(0,"#091326");sky.addColorStop(0.55,"#1b4f72");sky.addColorStop(1,"#f39c12");x.fillStyle=sky;x.fillRect(0,0,W,H*0.48);x.fillStyle="#8395a7";x.beginPath();x.moveTo(0,H*0.47);x.lineTo(W*0.16,H*0.25);x.lineTo(W*0.35,H*0.47);x.lineTo(W*0.58,H*0.21);x.lineTo(W*0.8,H*0.47);x.lineTo(W,H*0.3);x.lineTo(W,H*0.48);x.lineTo(0,H*0.48);x.fill();const sea=x.createLinearGradient(0,H*0.46,0,H);sea.addColorStop(0,"#1e90ff");sea.addColorStop(1,"#0a1931");x.fillStyle=sea;x.fillRect(0,H*0.46,W,H*0.54);x.fillStyle="#74b9ff";x.beginPath();x.ellipse(cx,cy+86,125,30,0,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.ellipse(cx,cy+78,118,23,0,0,7);x.fill();if(autoP>0){const hx=cx+(mode==="desk"?135:115),hy=cy+70+Math.sin(now/400)*3;x.fillStyle="#74b9ff";x.beginPath();x.ellipse(hx,hy+24,42,11,0,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.ellipse(hx,hy+20,38,9,0,0,7);x.fill();drawTux(hx,hy,0.38,0,now,1);}x.save();x.translate(cx,cy+Math.sin(now/260)*3);x.rotate(ang);x.scale(sc,sc);drawTux(0,0,mode==="desk"?1.15:1.1,evo,now,0);x.restore();const bTap=mode==="desk"?{x:W-145,y:135,w:130,h:42}:{x:14,y:H-168,w:(W-40)/3,h:44};const bFarm=mode==="desk"?{x:W-145,y:185,w:130,h:42}:{x:20+(W-40)/3,y:H-168,w:(W-40)/3,h:44};const bEvo=mode==="desk"?{x:W-145,y:H-62,w:130,h:44}:{x:14,y:H-114,w:W-28,h:44};let tx=cx,ty=cy+10,clk=0;if(t>3.2&&t<4.1){tx=bTap.x+bTap.w/2;ty=bTap.y+20;if(t>3.7&&actStep!==1){actStep=1;tapP=15;btnFlash="tap";clk=1;setTimeout(()=>btnFlash="",180);}}else if(t>5.8&&t<6.7){tx=bFarm.x+bFarm.w/2;ty=bFarm.y+20;if(t>6.3&&actStep!==2){actStep=2;autoP=45;btnFlash="farm";clk=1;setTimeout(()=>btnFlash="",180);}}else if(t>8.0&&t<9.6){if(!fish)fish={x:W*0.18,y:H*0.66};fish.x+=55*0.016;tx=fish.x;ty=fish.y;if(t>9.1&&actStep!==3){actStep=3;coins+=250;pops.push({x:fish.x,y:fish.y-10,t:"+250",l:1,c:"#ffd000"});fish=null;clk=1;}}else if(t>10.4&&t<11.5){tx=bEvo.x+bEvo.w/2;ty=bEvo.y+22;if(t>11.0&&actStep!==4){actStep=4;evo=1;tapP=35;btnFlash="evo";clk=1;setTimeout(()=>btnFlash="",200);}}else{const st=Math.floor(t*3.6);if(st!==lastClk){lastClk=st;clk=1;const cr=(st%4===0),g=tapP*(cr?4:1);coins+=g;sc=0.88;ang=(Math.random()-.5)*.18;pops.push({x:cx+(Math.random()-.5)*50,y:cy-45,t:(cr?txt.crit:"+")+g,l:1,c:cr?"#ff4757":"#fff"});}}ptr.x+=(tx-ptr.x)*0.24;ptr.y+=(ty-ptr.y)*0.24;ptr.clk=clk;if(fish){x.fillStyle="#ffd000";x.beginPath();x.ellipse(fish.x,fish.y,18,10,0,0,7);x.fill();x.beginPath();x.moveTo(fish.x-15,fish.y);x.lineTo(fish.x-28,fish.y-9);x.lineTo(fish.x-28,fish.y+9);x.closePath();x.fill();}x.fillStyle="rgba(13,22,38,.88)";x.beginPath();x.roundRect(12,12,115,36,12);x.fill();x.fillStyle="#ffd000";x.font="900 15px sans-serif";x.textAlign="center";x.fillText(Math.floor(coins),69,35);x.fillStyle="rgba(13,22,38,.88)";x.beginPath();x.roundRect(cx-125,12,250,36,12);x.fill();x.fillStyle="#7bed9f";x.font="900 11px sans-serif";x.fillText(txt.lvl[evo],cx,27);x.fillStyle="#2ed573";x.fillRect(cx-110,33,220*Math.min(1,t/11),7);drawBtn(bTap.x,bTap.y,bTap.w,bTap.h,"#162233",txt.ut,tapP*15,"tap");drawBtn(bFarm.x,bFarm.y,bFarm.w,bFarm.h,"#162233",txt.ua,autoP*12,"farm");drawBtn(bEvo.x,bEvo.y,bEvo.w,bEvo.h,"#ff9f1a",txt.ue,evo?"MAX":"500","evo");pops.forEach(p=>{p.y-=1.5;p.l-=0.025;x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.font="900 18px sans-serif";x.fillText(p.t,p.x,p.y);});x.globalAlpha=1;pops=pops.filter(p=>p.l>0);drawPtr();requestAnimationFrame(loop);}requestAnimationFrame(loop);document.getElementById("recBtn").onclick=()=>{if(rec)return;rec=1;rstSim();const btn=document.getElementById("recBtn"),st=document.getElementById("st");btn.disabled=true;st.textContent="Запись идёт (15 сек)...";const opt=MediaRecorder.isTypeSupported("video/webm;codecs=vp8")?{mimeType:"video/webm;codecs=vp8"}:{};const mr=new MediaRecorder(c.captureStream(30),opt),ch=[];mr.ondataavailable=e=>{if(e.data&&e.data.size>0)ch.push(e.data);};mr.onstop=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(ch,{type:"video/webm"}));a.download=`tux_clicker_${mode}_${lang}.webm`;a.click();rec=0;btn.disabled=false;st.textContent="Скачано! Прогони через ffmpeg в MP4.";};mr.start(250);setTimeout(()=>mr.stop(),15000);};</script></body></html>
